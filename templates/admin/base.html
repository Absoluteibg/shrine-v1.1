<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin &mdash; {{ app_name }}{% endblock %}</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
</head>
<body class="admin">
    <header class="admin-header">
        <a class="admin-header__brand" href="/admin">{{ app_name }} <span>Admin</span></a>
        <nav class="admin-nav" aria-label="Admin">
            <a href="/admin">Dashboard</a>
            <a href="/admin/works">Works</a>
            <a href="/admin/works/new">New work</a>
            <a href="/" target="_blank" rel="noopener">View site &#8599;</a>
        </nav>
        <form method="post" action="/admin/logout" class="admin-header__logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn--ghost">Log out</button>
        </form>
    </header>

    {% if flashes %}
    <div class="flash-stack">
        {% for f in flashes %}
        <div class="flash flash--{{ f.category }}">{{ f.message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="admin-main">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='js/admin.js') }}" defer></script>
</body>
</html>
